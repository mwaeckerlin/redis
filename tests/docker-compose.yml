# Functional test stack for mwaeckerlin/redis, driven by tests/run.sh.
#
# `redis` runs with defaults (AOF on, no password) and a data volume to
# prove persistence across a restart. `redis-auth` runs with a password
# to prove REDIS_PASSWORD is enforced. `cli` is the official redis
# image used purely as a redis-cli client — the image under test ships
# no client on purpose (headless).

services:

  redis:
    image: mwaeckerlin/redis
    volumes:
      - data:/data
    networks: [net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s

  redis-auth:
    image: mwaeckerlin/redis
    environment:
      REDIS_PASSWORD: "e2e-test-password-12"
    networks: [net]
    healthcheck:
      test: ["CMD", "/usr/bin/init", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s

  # the password as a Docker secret: compose copies the content of
  # E2E_REDIS_PASSWORD, which tests/run.sh sets with a line break at its end,
  # into /run/secrets/redis_password; the image's HEALTHCHECK reads it too
  redis-secret:
    image: mwaeckerlin/redis
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    networks: [net]

  # a secret that holds nothing but a line break: started by tests/run.sh
  # with `run`, it has to stop with «is empty»
  redis-secret-empty:
    image: mwaeckerlin/redis
    profiles: [empty-secret]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password_empty
    secrets:
      - redis_password_empty
    networks: [net]

  # no healthcheck of its own: Docker takes the HEALTHCHECK of the image
  redis-plain:
    image: mwaeckerlin/redis
    networks: [net]

  # the snapshot of the official image: rdb-writer is the current
  # redis:latest and writes /data/dump.rdb, redis-rdb is the image under test
  # with the settings of the Authentik stack and loads it from the same volume
  rdb-writer:
    image: redis:latest
    user: "102:102"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--dir", "/data"]
    volumes:
      - rdbdata:/data
    networks: [net]

  redis-rdb:
    image: mwaeckerlin/redis
    environment:
      REDIS_SAVE: "60 1"
      REDIS_APPENDONLY: "no"
    volumes:
      - rdbdata:/data
    networks: [net]

  cli:
    image: redis:alpine
    entrypoint: ["sleep", "infinity"]
    networks: [net]

secrets:
  redis_password:
    environment: E2E_REDIS_PASSWORD
  redis_password_empty:
    environment: E2E_REDIS_EMPTY_PASSWORD

networks:
  net:

volumes:
  data:
  rdbdata:
